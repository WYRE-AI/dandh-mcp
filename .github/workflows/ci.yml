name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  # Canonical fleet CI: npm ci, lint, typecheck, build, destructive-tool
  # warning lint, process.env credential-mutation guard, unit tests, and a
  # Docker build smoke test.
  ci:
    permissions:
      contents: read
      packages: read
    uses: wyre-technology/.github/.github/workflows/mcp-server-ci.yml@06856d54d8829929e387523e6c1767d54416e978 # main
    with:
      node-versions: '["22", "24"]'
      lint-destructive-warnings: true
      docker-smoke-test: true

  stdio-smoke:
    name: stdio smoke (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      # No dependency lifecycle scripts; esbuild resolves its platform binary
      # from the @esbuild/* optional dependency without its postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run smoke
