name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline (build ->
# semantic-release -> Docker -> MCP Registry -> security). On pull_request
# only its unconditional verify job runs; publishing is push-to-main only.
jobs:
  release:
    permissions:
      actions: read # Security Scan: SARIF upload reads run metadata on a private repo
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    # reusable-workflows#3: private repos skip the public MCP Registry publish
    # and the SARIF upload (Code Security is off); Trivy still gates the job.
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@508ef4ddcd19285d108423a27f44078a15451575
    with:
      server-name: dandh-mcp
      image-name: ghcr.io/wyre-ai/dandh-mcp
      fail-on-severity: HIGH,CRITICAL
    secrets: inherit
